<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTA PRO - goldtrackER</title>
    <!-- Favicon basata su goldtrackER.png -->
    <link rel="icon" type="image/png" href="goldtrackER.png">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #121316;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 10px;
        }
        .container {
            width: 100%;
            background: #1a1c23;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            border: 1px solid #2d313e;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid #2d313e;
            padding-bottom: 10px;
        }
        h1 {
            font-size: 1.2rem;
            letter-spacing: 1px;
            color: #d4af37;
            text-transform: uppercase;
        }
        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 15px;
            align-items: center;
        }
        .gain-control {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #252836;
            border: 1px solid #3d4255;
            padding: 6px 12px;
            border-radius: 4px;
        }
        .gain-control label {
            font-size: 0.8rem;
            font-weight: 600;
            color: #00d2ff;
            text-transform: uppercase;
        }
        .gain-control input[type="range"] {
            width: 90px;
            cursor: pointer;
        }
        .gain-val {
            font-size: 0.85rem;
            font-weight: bold;
            min-width: 40px;
            text-align: right;
            color: #fff;
        }
        button, select {
            background: #252836;
            color: #fff;
            border: 1px solid #3d4255;
            padding: 10px 14px;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        select {
            outline: none;
            color: #00d2ff;
        }
        button:hover, select:hover {
            background: #32374a;
            border-color: #00d2ff;
        }
        button#btn-start {
            background: #00c853;
            border-color: #00c853;
            color: #121316;
        }
        button#btn-start:hover {
            background: #00e676;
        }
        button#btn-zero {
            background: #d4af37;
            border-color: #d4af37;
            color: #121316;
        }
        button#btn-zero:hover {
            background: #e6c555;
        }
        button#btn-reset {
            background: #ff5252;
            border-color: #ff5252;
            color: #fff;
        }
        button#btn-reset:hover {
            background: #ff7676;
        }
        button#btn-freeze.frozen {
            background: #ff9100;
            border-color: #ff9100;
            color: #121316;
        }
        .canvas-container {
            position: relative;
            width: 100%;
            height: 500px;
            background: #0e0f12;
            border-radius: 4px;
            border: 1px solid #252836;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        /* Display dB grande in basso */
        .db-display-container {
            display: flex;
            justify-content: center;
            align-items: center;
            background: #14161d;
            border: 1px solid #2d313e;
            border-radius: 6px;
            padding: 15px;
            margin-top: 15px;
        }
        .db-value-large {
            font-size: 2.8rem;
            font-weight: 900;
            color: #00d2ff;
            letter-spacing: 2px;
            font-family: monospace;
        }
        .eq-guide-panel {
            margin-top: 15px;
            background: #14161d;
            border: 1px solid #2d313e;
            border-radius: 6px;
            padding: 15px;
            display: none;
        }
        .eq-guide-panel.visible {
            display: block;
        }
        .eq-guide-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .eq-guide-title {
            font-size: 0.95rem;
            color: #d4af37;
            text-transform: uppercase;
            font-weight: bold;
        }
        .eq-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 8px;
            max-height: 180px;
            overflow-y: auto;
            padding-right: 5px;
        }
        .eq-card {
            background: #1d202b;
            border: 1px solid #2e3344;
            border-radius: 4px;
            padding: 8px;
            text-align: center;
        }
        .eq-card.cut { border-color: #ff5252; }
        .eq-card.boost { border-color: #00e676; }
        .eq-freq { font-size: 0.8rem; color: #a0a5b5; margin-bottom: 4px; }
        .eq-gain { font-size: 1rem; font-weight: bold; }
        .eq-card.cut .eq-gain { color: #ff5252; }
        .eq-card.boost .eq-gain { color: #00e676; }
        .status { font-size: 0.8rem; color: #888; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>RTA PRO — goldtrackER</h1>
        <div id="status" class="status">Microfono: Disattivato</div>
    </div>

    <div class="controls">
        <button id="btn-start">Start Mic</button>
        
        <select id="select-bands">
            <option value="31">31 Bande (1/3 Ottava)</option>
            <option value="120">120 Bande (Alta Risoluzione)</option>
        </select>

        <div class="gain-control">
            <label for="gainSlider">Mic Gain</label>
            <input type="range" id="gainSlider" min="0" max="5" step="0.05" value="1.0">
            <span id="gainVal" class="gain-val">1.0x</span>
        </div>

        <button id="btn-zero">ZERO</button>
        <button id="btn-reset">RESET</button>
        <button id="btn-freeze">Freeze</button>
        <button id="btn-toggle-guide">Guida EQ</button>
    </div>

    <!-- Grafico a tutto schermo -->
    <div class="canvas-container">
        <canvas id="rtaCanvas"></canvas>
    </div>

    <!-- Display dB Grande in basso -->
    <div class="db-display-container">
        <div id="dbReadout" class="db-value-large">- - - dB</div>
    </div>

    <!-- Pannello Guida Correzione EQ -->
    <div id="eqGuidePanel" class="eq-guide-panel">
        <div class="eq-guide-header">
            <span class="eq-guide-title">Suggerimenti Correzione Equalizzatore Impianto</span>
            <span id="guideStatus" style="font-size: 0.8rem; color: #888;">Esegui il POINT ZERO per generare la guida</span>
        </div>
        <div id="eqGrid" class="eq-grid"></div>
    </div>
</div>

<script>
    const ISO_31_FREQUENCIES = [
        20, 25, 31.5, 40, 50, 63, 80, 100, 125, 160, 200, 250, 315, 400, 500,
        630, 800, 1000, 1250, 1600, 2000, 2500, 3150, 4000, 5000, 6300, 8000,
        10000, 12500, 16000, 20000
    ];

    let numBands = 31;
    let bandFrequencies = [];
    let calibrationOffsets = [];
    let currentBandsDb = [];
    let frozenBandsDb = [];
    let rawCapturedBandsDb = [];

    let audioCtx = null;
    let analyser = null;
    let gainNode = null;
    let micStream = null;
    let isRunning = false;
    let isFrozen = false;
    let hasGrabbed = false;

    const canvas = document.getElementById('rtaCanvas');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');
    const selectBands = document.getElementById('select-bands');
    const eqGuidePanel = document.getElementById('eqGuidePanel');
    const eqGrid = document.getElementById('eqGrid');
    const guideStatus = document.getElementById('guideStatus');
    const gainSlider = document.getElementById('gainSlider');
    const gainVal = document.getElementById('gainVal');
    const dbReadout = document.getElementById('dbReadout');

    gainSlider.addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        gainVal.textContent = val.toFixed(1) + 'x';
        if (gainNode) {
            gainNode.gain.setValueAtTime(val, audioCtx.currentTime);
        }
    });

    function setupBands(count) {
        numBands = count;
        bandFrequencies = [];

        if (numBands === 31) {
            bandFrequencies = [...ISO_31_FREQUENCIES];
        } else {
            const minLog = Math.log10(20);
            const maxLog = Math.log10(20000);
            for (let i = 0; i < 120; i++) {
                const logFreq = minLog + (i / 119) * (maxLog - minLog);
                bandFrequencies.push(Math.pow(10, logFreq));
            }
        }

        calibrationOffsets = new Array(numBands).fill(0);
        currentBandsDb = new Array(numBands).fill(-100);
        frozenBandsDb = new Array(numBands).fill(-100);
        rawCapturedBandsDb = new Array(numBands).fill(0);
        hasGrabbed = false;
        updateEQGuide();
    }

    setupBands(31);

    selectBands.addEventListener('change', (e) => {
        setupBands(parseInt(e.target.value));
    });

    function resizeCanvas() {
        const rect = canvas.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        ctx.scale(dpr, dpr);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    document.getElementById('btn-start').addEventListener('click', async () => {
        if (isRunning) return;

        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            micStream = audioCtx.createMediaStreamSource(stream);

            gainNode = audioCtx.createGain();
            gainNode.gain.value = parseFloat(gainSlider.value);

            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 16384;
            analyser.smoothingTimeConstant = 0.70;

            micStream.connect(gainNode);
            gainNode.connect(analyser);

            isRunning = true;
            statusEl.textContent = "Microfono: Attivo";
            statusEl.style.color = "#00c853";
            document.getElementById('btn-start').style.display = "none";

            requestAnimationFrame(draw);
        } catch (err) {
            alert("Errore nell'accesso al microfono: " + err.message);
        }
    });

    function calculateBands() {
        if (!analyser) return;

        const bufferLength = analyser.frequencyBinCount;
        const fftData = new Float32Array(bufferLength);
        analyser.getFloatFrequencyData(fftData);

        const sampleRate = audioCtx.sampleRate;
        const nyquist = sampleRate / 2;
        const binSize = nyquist / bufferLength;

        let sumEnergyTotal = 0;
        let countTotal = 0;

        for (let i = 0; i < numBands; i++) {
            const centerFreq = bandFrequencies[i];
            const factor = numBands === 31 ? Math.pow(2, 1 / 6) : Math.pow(2, 1 / 24);
            const lowerFreq = centerFreq / factor;
            const upperFreq = centerFreq * factor;

            let lowBin = Math.floor(lowerFreq / binSize);
            let highBin = Math.ceil(upperFreq / binSize);

            lowBin = Math.max(0, lowBin);
            highBin = Math.min(bufferLength - 1, highBin);

            let sumEnergy = 0;
            let count = 0;

            for (let b = lowBin; b <= highBin; b++) {
                const db = fftData[b];
                if (db > -120) {
                    const energy = Math.pow(10, db / 10);
                    sumEnergy += energy;
                    sumEnergyTotal += energy;
                    count++;
                    countTotal++;
                }
            }

            let bandDb = -100;
            if (count > 0 && sumEnergy > 0) {
                bandDb = 10 * Math.log10(sumEnergy / count);
            }

            currentBandsDb[i] = bandDb - calibrationOffsets[i];
        }

        // Calcolo e aggiornamento del valore dB globale in grande
        if (countTotal > 0 && sumEnergyTotal > 0) {
            const overallDb = 10 * Math.log10(sumEnergyTotal / countTotal);
            dbReadout.textContent = overallDb.toFixed(1) + " dB";
        } else {
            dbReadout.textContent = "- - - dB";
        }
    }

    // Tasto ZERO (Point Zero calibration)
    document.getElementById('btn-zero').addEventListener('click', () => {
        if (!isRunning) return;

        let totalDb = 0;
        let validBands = 0;
        for (let i = 0; i < numBands; i++) {
            if (currentBandsDb[i] > -90) {
                totalDb += currentBandsDb[i];
                validBands++;
            }
        }
        const avgDb = validBands > 0 ? totalDb / validBands : 0;

        for (let i = 0; i < numBands; i++) {
            rawCapturedBandsDb[i] = currentBandsDb[i] - avgDb;
            calibrationOffsets[i] += currentBandsDb[i];
        }

        hasGrabbed = true;
        eqGuidePanel.classList.add('visible');
        updateEQGuide();
    });

    // Tasto RESET (Ripristina calibrazione e offset dB)
    document.getElementById('btn-reset').addEventListener('click', () => {
        calibrationOffsets.fill(0);
        rawCapturedBandsDb.fill(0);
        hasGrabbed = false;
        updateEQGuide();
    });

    function updateEQGuide() {
        eqGrid.innerHTML = '';

        if (!hasGrabbed) {
            guideStatus.textContent = 'Esegui il "ZERO" per generare la guida.';
            return;
        }

        guideStatus.textContent = 'Valori indicativi da applicare sull\'EQ dell\'impianto:';
        let countAdjustments = 0;

        for (let i = 0; i < numBands; i++) {
            const freq = bandFrequencies[i];
            const deviation = rawCapturedBandsDb[i];

            let suggestedGain = -deviation;
            if (suggestedGain > 6) suggestedGain = 6;
            if (suggestedGain < -12) suggestedGain = -12;

            if (Math.abs(suggestedGain) >= 1.5) {
                countAdjustments++;
                const card = document.createElement('div');
                const isCut = suggestedGain < 0;
                card.className = `eq-card ${isCut ? 'cut' : 'boost'}`;

                let freqLabel = freq >= 1000 ? (freq / 1000).toFixed(freq % 1000 === 0 ? 0 : 1) + ' kHz' : Math.round(freq) + ' Hz';
                let gainLabel = (suggestedGain > 0 ? '+' : '') + suggestedGain.toFixed(1) + ' dB';

                card.innerHTML = `
                    <div class="eq-freq">${freqLabel}</div>
                    <div class="eq-gain">${gainLabel}</div>
                `;
                eqGrid.appendChild(card);
            }
        }

        if (countAdjustments === 0) {
            eqGrid.innerHTML = '<div style="color:#00e676; font-size:0.9rem; padding:10px;">La risposta dell\'impianto è già ottimale (deviazioni entro +/- 1.5 dB).</div>';
        }
    }

    document.getElementById('btn-toggle-guide').addEventListener('click', () => {
        eqGuidePanel.classList.toggle('visible');
    });

    const btnFreeze = document.getElementById('btn-freeze');
    btnFreeze.addEventListener('click', () => {
        isFrozen = !isFrozen;
        if (isFrozen) {
            frozenBandsDb = [...currentBandsDb];
            btnFreeze.classList.add('frozen');
            btnFreeze.textContent = 'Unfreeze';
        } else {
            btnFreeze.classList.remove('frozen');
            btnFreeze.textContent = 'Freeze';
        }
    });

    function draw() {
        requestAnimationFrame(draw);

        const rect = canvas.getBoundingClientRect();
        const width = rect.width;
        const height = rect.height;

        ctx.clearRect(0, 0, width, height);

        if (!isFrozen) {
            calculateBands();
        }

        const bands = isFrozen ? frozenBandsDb : currentBandsDb;

        const minDb = -60;
        const maxDb = 12;
        const dbRange = maxDb - minDb;

        // Griglia dB
        ctx.strokeStyle = '#252836';
        ctx.lineWidth = 1;
        ctx.fillStyle = '#555e75';
        ctx.font = '10px sans-serif';

        for (let db = maxDb; db >= minDb; db -= 12) {
            const y = height - ((db - minDb) / dbRange) * height;
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(width, y);
            ctx.stroke();
            ctx.fillText(`${db > 0 ? '+' + db : db} dB`, 8, y - 4);
        }

        // Render Barre
        const paddingLeft = 35;
        const availableWidth = width - paddingLeft;
        const barGap = numBands === 31 ? 2 : 1;
        const totalBarWidth = availableWidth / numBands;
        const barWidth = Math.max(1, totalBarWidth - barGap);

        let isClipping = false;

        for (let i = 0; i < numBands; i++) {
            if (bands[i] >= maxDb) isClipping = true;

            const valDb = Math.max(minDb, Math.min(maxDb, bands[i]));
            const barHeight = ((valDb - minDb) / dbRange) * height;
            const x = paddingLeft + i * totalBarWidth;
            const y = height - barHeight;

            const gradient = ctx.createLinearGradient(0, height, 0, 0);
            gradient.addColorStop(0, '#00d2ff');
            gradient.addColorStop(0.7, '#00c853');
            gradient.addColorStop(1, '#ff1744');

            ctx.fillStyle = isFrozen ? '#ff9100' : gradient;
            ctx.fillRect(x, y, barWidth, barHeight);

            let showLabel = false;
            if (numBands === 31) {
                showLabel = (i % 3 === 0 || i === 30);
            } else {
                showLabel = (i % 12 === 0 || i === 119);
            }

            if (showLabel) {
                ctx.fillStyle = '#6c728a';
                ctx.font = '9px sans-serif';
                ctx.textAlign = 'center';
                const freq = bandFrequencies[i];
                let label = freq >= 1000 ? (freq / 1000).toFixed(1) + 'k' : Math.round(freq);
                ctx.fillText(label, x + barWidth / 2, height - 6);
            }
        }

        if (isClipping) {
            ctx.fillStyle = '#ff1744';
            ctx.font = 'bold 12px sans-serif';
            ctx.fillText('CLIP / PEAK', width - 80, 20);
        }
    }
</script>

</body>
</html>
